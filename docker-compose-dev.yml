services:
  frontend:
    container_name: khclicker-frontend-dev
    build:
      context: ./frontend
      target: dev
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - ./frontend/node_modules:/app/node_modules
    working_dir: /app
    restart: unless-stopped
    ports:
      - 3000:3000
    networks:
      - khclicker-network

  backend:
    container_name: khclicker-backend-dev
    build:
      context: ./backend
      target: dev
    env_file:
      - .env
    volumes:
      - ./backend:/app
    working_dir: /app
    restart: unless-stopped
    ports:
      - 4000:3000
    networks:
      - khclicker-network

  database:
    image: postgres
    container_name: khclicker-database-dev
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - khclicker-network

  adminer:
    image: adminer
    container_name: khclicker-adminer-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - khclicker-network

networks:
  khclicker-network:
    driver: bridge
